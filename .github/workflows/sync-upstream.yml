name: Sync upstream

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'swizzbeatz/PC5'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Check synchronization safeguards
        run: python3 .github/scripts/test_sync_upstream.py
      - name: Synchronize main if upstream has new commits
        run: python3 .github/scripts/sync_upstream.py
